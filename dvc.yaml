# dvc.yaml — v2 (S1-06). v1 C-MAPSS stages removed (ST0-12); v1 reproduction is the `python -m` path in docs/v1_report.md.
# File reproducibility only: DB state is verified separately by scripts/verify_mart.py + check_mart_inputs.py
# (dvc status clean ≠ mart loaded). Stages that touch Postgres read $SGP_PG_DSN from the shell environment.
stages:
  preprocess_tep:
    cmd: python -m core_pipeline.data.tep_loader --data-dir data/raw/TEP --output-dir data/processed/TEP
    deps:
      - core_pipeline/data/tep_loader.py
      - data/raw/TEP
    outs:
      - data/processed/TEP

  parse_kosha_docling:
    cmd: .venv-docling/bin/docling convert data/raw/kosha/files --to md --to json --no-ocr --tables --table-mode accurate --device cpu --output data/processed/kosha/docling
    deps:
      - data/raw/kosha/files
      - requirements_docling.txt
    outs:
      - data/processed/kosha/docling

  load_mart:
    # derived mart (episodes / windows / labels) from the frozen split + registers parquet identity & content sha.
    # Idempotent: unchanged input contract → receipt byte-identical → stage up to date.
    cmd: python scripts/load_mart.py --dsn "$SGP_PG_DSN" --receipt outputs/mart_load_receipt.json
    deps:
      - scripts/load_mart.py
      - sql/001_schema.sql
      - core_pipeline/prereg_constants.py
      - outputs/stage0_episode_split.json
      - data/processed/TEP/_manifest.json
    outs:
      - outputs/mart_load_receipt.json:
          cache: false

  gate_reference:
    # external gate reference from calibration fault-free episodes (prereg §3.0, ST0-10 (a)); reads ids from staging.
    cmd: python scripts/build_gate_reference.py --dsn "$SGP_PG_DSN" --processed data/processed/TEP --out data/processed/gate_reference_v1.parquet
    deps:
      - scripts/build_gate_reference.py
      - core_pipeline/governance/gate_adapter.py
      - outputs/mart_load_receipt.json
      - data/processed/TEP
    outs:
      - data/processed/gate_reference_v1.parquet
      - data/processed/gate_reference_v1.json:
          cache: false

  fit_detector:
    cmd: python scripts/fit_detector.py --dsn "$SGP_PG_DSN" --processed data/processed/TEP --out models/detector_v1 && cp models/detector_v1/meta.json outputs/model_meta/detector_v1.json
    deps:
      - scripts/fit_detector.py
      - scripts/check_mart_inputs.py
      - core_pipeline/prereg_constants.py
      - core_pipeline/data/tep_loader.py
      - core_pipeline/anomaly/isolation_forest.py
      - core_pipeline/features/window_features.py
      - core_pipeline/anomaly/if_window.py
      - core_pipeline/anomaly/conformal.py
      - core_pipeline/anomaly/zscore_l0.py
      - outputs/mart_load_receipt.json
      - outputs/stage0_episode_split.json
      - data/processed/TEP
    outs:
      - models/detector_v1
      - outputs/model_meta/detector_v1.json:
          cache: false

  fit_diagnoser:
    cmd: python scripts/fit_diagnoser.py --dsn "$SGP_PG_DSN" --processed data/processed/TEP --out models/diagnoser_v1 && cp models/diagnoser_v1/diag_meta.json outputs/model_meta/diagnoser_v1.json
    deps:
      - scripts/fit_diagnoser.py
      - scripts/check_mart_inputs.py
      - core_pipeline/prereg_constants.py
      - core_pipeline/data/tep_loader.py
      - core_pipeline/features/window_features.py
      - core_pipeline/diagnosis/classifier.py
      - outputs/mart_load_receipt.json
      - outputs/stage0_episode_split.json
      - data/processed/TEP
    outs:
      - models/diagnoser_v1
      - outputs/model_meta/diagnoser_v1.json:
          cache: false

  calibrate_gate_drift:
    cmd: python scripts/calibrate_gate_drift.py --dsn "$SGP_PG_DSN" --processed data/processed/TEP --out models/gate_v2/gate_calibration.json
    deps:
      - scripts/calibrate_gate_drift.py
      - scripts/check_mart_inputs.py
      - core_pipeline/prereg_constants.py
      - core_pipeline/governance/gate_v2.py
      - core_pipeline/governance/gate_adapter.py
      - core_pipeline/governance/quality_gate.py
      - core_pipeline/governance/quality_metrics.py
      - core_pipeline/anomaly/conformal.py
      - data/processed/gate_reference_v1.parquet
      - models/detector_v1
      - outputs/mart_load_receipt.json
      - outputs/stage0_episode_split.json
    outs:
      - models/gate_v2/gate_calibration.json:
          cache: false

  fit_detector_at:
    cmd: python scripts/fit_detector_at.py --dsn "$SGP_PG_DSN" --processed data/processed/TEP --out models/detector_at_v1 --sign 1 && cp models/detector_at_v1/meta.json outputs/model_meta/detector_at_v1.json
    deps:
      - scripts/fit_detector_at.py
      - scripts/check_mart_inputs.py
      - core_pipeline/prereg_constants.py
      - core_pipeline/data/tep_loader.py
      - core_pipeline/anomaly/anomaly_transformer.py
      - core_pipeline/anomaly/at_window.py
      - core_pipeline/anomaly/conformal.py
      - outputs/mart_load_receipt.json
      - outputs/stage0_episode_split.json
      - data/processed/TEP
    outs:
      - models/detector_at_v1
      - outputs/model_meta/detector_at_v1.json:
          cache: false

  build_clause_corpus:
    cmd: python scripts/build_clause_corpus.py
    deps:
      - scripts/build_clause_corpus.py
      - core_pipeline/docs/clause_parser.py
      - core_pipeline/docs/chunker.py
      - outputs/kosha_clause_index.json
      - outputs/corpus_known_diffs.json
      - data/processed/kosha/docling
    outs:
      - outputs/kosha_clauses.jsonl:
          cache: false
      - outputs/kosha_chunks.jsonl:
          cache: false

  build_retrieval_index:
    cmd: python scripts/build_retrieval_index.py
    deps:
      - scripts/build_retrieval_index.py
      - core_pipeline/retrieval/index.py
      - core_pipeline/retrieval/models.py
      - core_pipeline/retrieval/model_pins.json
      - outputs/kosha_chunks.jsonl
    outs:
      - models/retrieval_v1/dense.npy
      - models/retrieval_v1/chunks.jsonl
      - models/retrieval_v1/index_meta.json:
          cache: false

  fix_tau:
    cmd: python scripts/fix_tau.py
    deps:
      - scripts/fix_tau.py
      - evals/rag_dev_set.json
      - models/retrieval_v1/dense.npy
      - models/retrieval_v1/index_meta.json
      - outputs/fault_to_guidance_map.json
      - core_pipeline/retrieval
    outs:
      - models/retrieval_v1/tau.json:
          cache: false
