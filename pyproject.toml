[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-governance-platform"
version = "2.0.0.dev0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["core_pipeline*"]

[tool.pytest.ini_options]
markers = [
    "golden: frozen golden regressions (scripts/make_goldens.py; needs SGP_TEST_PG_DSN + models)",
]
